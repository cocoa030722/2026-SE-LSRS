spring.application.name=lsrs

# MySQL. bootRun 시 spring-boot-docker-compose 가 compose.yaml 의 컨테이너를 띄우고 아래 값 대신 그 컨테이너에 연결한다.
# compose 없이 실행할 때(배포 등)는 DB_URL·DB_USERNAME·DB_PASSWORD 환경 변수를 쓴다.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/lsrs}
spring.datasource.username=${DB_USERNAME:lsrs}
spring.datasource.password=${DB_PASSWORD:lsrs}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# data.sql: 정책 파라미터 기본값 (Hibernate 스키마 생성 후 실행)
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
app.jwt.secret=${JWT_SECRET}
